<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Stress in bici</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Same LTS-1 face design as the legend/popup indicators (ltsFaceIcon()
     below) - teal circle, calm smile - rather than a generic icon. -->
<link rel="icon" href="favicon.ico" sizes="any" />

<!-- SEO + social preview. web/ is served as the site root, so
     social-preview.png sits at the same level as index.html both here and
     once deployed - stressinbici.it/social-preview.png. Description is an
     excerpt of the About text (see aboutBody in i18n.js) with a short
     English line appended for sharing outside Italy - meta description
     stays Italian-only and shorter, closer to Google's ~155-character
     display limit. -->
<meta name="description" content="Stress in bici è una mappa delle strade italiane vista dalla prospettiva di chi le percorre in bicicletta: ogni tratto riceve un valore di stress da 1 a 4." />
<link rel="canonical" href="https://stressinbici.it/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Stress in bici" />
<meta property="og:title" content="Stress in bici" />
<meta property="og:description" content="Stress in bici è una mappa delle strade italiane vista dalla prospettiva di chi le percorre in bicicletta: ogni tratto riceve un valore di stress da 1 a 4. An LTS-based cycling stress map of Italian roads." />
<meta property="og:image" content="https://stressinbici.it/social-preview.png" />
<meta property="og:image:width" content="2400" />
<meta property="og:image:height" content="1260" />
<meta property="og:url" content="https://stressinbici.it/" />
<meta property="og:locale" content="it_IT" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Stress in bici" />
<meta name="twitter:description" content="Stress in bici è una mappa delle strade italiane vista dalla prospettiva di chi le percorre in bicicletta: ogni tratto riceve un valore di stress da 1 a 4. An LTS-based cycling stress map of Italian roads." />
<meta name="twitter:image" content="https://stressinbici.it/social-preview.png" />
<!-- Vendored locally at a pinned exact version rather than CDN "@major"
     floating tags (see web/assets/vendor/README.md) - unpkg's `@5`/`@6`/etc.
     resolve to whatever the latest matching release is AT REQUEST TIME,
     so the app could silently start running a different minor/patch
     version than what was tested. `defer` on every script here (all
     plain globals, no ES modules anywhere in this app - see routing.js's
     own comment) lets the browser parse the rest of the document while
     these download, instead of blocking on each one in turn; execution
     still runs in this same document order, right before
     DOMContentLoaded, so app.js can still rely on maplibregl/pmtiles/
     routing.js's globals/i18n.js's t() all being ready. -->
<link href="assets/vendor/maplibre-gl-5.24.0.css" rel="stylesheet" />
<script src="assets/vendor/maplibre-gl-5.24.0.js" defer></script>
<script src="assets/vendor/pmtiles-4.5.0.js" defer></script>
<!-- Turf, jsPDF and ngraph.graph/ngraph.path are NOT loaded here - each is
     only needed by one specific feature (gap-buffer/elevation geometry,
     PDF export, and the router respectively), so most visits never touch
     any of them. They're fetched on demand instead, from web/assets/vendor/, via
     ensureTurfLoaded/ensureJspdfLoaded/ensureNgraphLoaded in app.js. -->
<script src="routing.js" defer></script>
<script src="i18n.js" defer></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header id="site-header">
  <div id="header-brand">
    <img id="site-logo" src="logo.svg" alt="" />
    <h1 id="site-title">Stress in bici</h1>
    <span id="site-tagline"></span>
    <span id="area-badge"></span>
  </div>
  <nav id="header-nav">
    <!-- comuni.html (cross-comune stats/comparison page) is deliberately
         unlinked from the main nav for now - work paused, page still
         built and reachable directly, just not discoverable from here
         until it's picked back up. -->
    <button id="about-toggle" class="nav-link"></button>
    <button id="faq-toggle" class="nav-link"></button>
    <button id="privacy-toggle" class="nav-link"></button>
    <div id="lang-switcher">
      <select id="lang-select">
        <option value="it">IT</option>
        <option value="en">EN</option>
        <option value="de">DE</option>
        <option value="fr">FR</option>
      </select>
    </div>
  </nav>
</header>

<div id="map-container">
  <div id="map"></div>
  <div id="loading-indicator" class="hidden">
    <div class="spinner"></div>
    <div id="loading-title"></div>
  </div>
  <div id="zoom-hint" class="hidden"></div>
  <div id="panel">
    <button id="panel-toggle" type="button"></button>
    <div id="panel-body">
      <div id="legend"></div>
      <p id="legend-hint"></p>
      <div id="facility-legend"></div>
      <div id="style-switcher">
        <label><input type="radio" name="basemap" value="light"> <span id="bg-light-label"></span></label>
        <label><input type="radio" name="basemap" value="summer"> <span id="bg-summer-label"></span></label>
        <label><input type="radio" name="basemap" value="cycling"> <span id="bg-cycling-label"></span></label>
        <label><input type="radio" name="basemap" value="dark"> <span id="bg-dark-label"></span></label>
      </div>
      <button id="gap-toggle"></button>
      <div id="gap-panel">
        <h2 id="gap-heading"></h2>
        <p id="gap-hint"></p>
        <div id="gap-list"></div>
        <div id="gap-pager"></div>
      </div>
    </div>
  </div>
</div>

<footer id="site-footer">
  <span id="footer-credit"></span>
  <span id="footer-hosting">
    <span id="footer-hosting-text"></span>
    <a href="https://www.top-ix.org/" target="_blank" rel="noopener">
      <img src="assets/img/top-ix-logo.png" alt="TOP-IX" id="footer-logo" />
    </a>
  </span>
</footer>

<div id="about-panel" class="info-panel hidden">
  <button id="about-close" class="info-panel-close">&times;</button>
  <p id="about-ai-note" class="ai-note hidden"></p>
  <h2 id="about-heading"></h2>
  <p id="about-subtitle"></p>
  <div id="about-body"></div>
</div>
<div id="faq-panel" class="info-panel hidden">
  <button id="faq-close" class="info-panel-close">&times;</button>
  <p id="faq-ai-note" class="ai-note hidden"></p>
  <h2 id="faq-heading"></h2>
  <div id="faq-list"></div>
</div>
<div id="privacy-panel" class="info-panel hidden">
  <button id="privacy-close" class="info-panel-close">&times;</button>
  <h2 id="privacy-heading"></h2>
  <p id="privacy-intro"></p>
</div>
