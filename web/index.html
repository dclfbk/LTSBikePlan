<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Stress in bici</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Same LTS-1 face design as the legend/popup indicators (ltsFaceIcon()
     below) - teal circle, calm smile - rather than a generic icon. -->
<link rel="icon" href="favicon.ico" sizes="any" />

<!-- SEO + social preview. web/ is served as the site root, so
     social-preview.png sits at the same level as index.html both here and
     once deployed - stressinbici.it/social-preview.png. Description is an
     excerpt of the About text (see aboutBody in i18n.js) with a short
     English line appended for sharing outside Italy - meta description
     stays Italian-only and shorter, closer to Google's ~155-character
     display limit. -->
<meta name="description" content="Stress in bici è una mappa delle strade italiane vista dalla prospettiva di chi le percorre in bicicletta: ogni tratto riceve un valore di stress da 1 a 4." />
<link rel="canonical" href="https://stressinbici.it/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Stress in bici" />
<meta property="og:title" content="Stress in bici" />
<meta property="og:description" content="Stress in bici è una mappa delle strade italiane vista dalla prospettiva di chi le percorre in bicicletta: ogni tratto riceve un valore di stress da 1 a 4. An LTS-based cycling stress map of Italian roads." />
<meta property="og:image" content="https://stressinbici.it/social-preview.png" />
<meta property="og:image:width" content="2400" />
<meta property="og:image:height" content="1260" />
<meta property="og:url" content="https://stressinbici.it/" />
<meta property="og:locale" content="it_IT" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Stress in bici" />
<meta name="twitter:description" content="Stress in bici è una mappa delle strade italiane vista dalla prospettiva di chi le percorre in bicicletta: ogni tratto riceve un valore di stress da 1 a 4. An LTS-based cycling stress map of Italian roads." />
<meta name="twitter:image" content="https://stressinbici.it/social-preview.png" />
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
<!-- Only used for turf.buffer() on the selected street from the priority
     list (see focusGapIntervention) - a real geographic buffer needs actual
     geodesic math, not something worth hand-rolling. -->
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<!-- Only used to build the downloadable PDF (see PrintControl in app.js) -
     a real PDF file, not the browser print dialog: exposes window.jspdf.jsPDF. -->
<script src="https://unpkg.com/jspdf@2/dist/jspdf.umd.min.js"></script>
<script src="i18n.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; }

  /* Z-index layers: map (auto, bottom) < #panel (5) < #site-header (10) <
     .info-panel modals (20, position:fixed, must cover everything
     including the header). */
  #map-container { position: relative; flex: 1 1 auto; min-height: 0; }
  #map { width: 100%; height: 100%; }

  #site-footer {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 4px 16px; padding: 6px 16px;
    background: white; box-shadow: 0 -1px 4px rgba(0,0,0,0.15);
    position: relative; z-index: 10;
    font: 12px/1.4 system-ui, sans-serif; color: #555;
  }
  #footer-credit { white-space: nowrap; }
  #footer-credit a { color: inherit; text-decoration: underline; }
  #footer-credit a:hover { color: #4c78a8; }
  #footer-hosting { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #footer-logo { height: 18px; width: auto; vertical-align: middle; }

  #site-header {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 6px 16px; padding: 10px 16px;
    background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    position: relative; z-index: 10;
    font: 13px/1.4 system-ui, sans-serif;
  }
  #header-brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  #site-title { font-size: 18px; margin: 0; white-space: nowrap; }
  #site-tagline { font-size: 13px; color: #555; }
  #area-badge { font-size: 13px; color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #header-nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #lang-switcher select { font: inherit; padding: 2px 4px; }

  /* Nominatim geocoder (see GeocoderControl in the script below - plain
     fetch, no plugin) - a map corner control like zoom/terrain/print, not
     a header element: a search box sitting in the header nav read as part
     of the site's own navigation, not "search the map", which was
     confusing (misleading users about what it does). Collapsed to a
     magnifying-glass icon by default, matching the other icon controls it
     stacks with; clicking it expands a flyout to the left (into the map,
     away from the viewport edge - the control itself is pinned top-right). */
  .geocoder-control { position: relative; }
  #geocoder-panel {
    position: absolute; top: 0; right: 100%; margin-right: 6px; width: 260px;
    background: white; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    padding: 6px;
  }
  #geocoder-panel.hidden { display: none; }
  #geocoder-toggle.active { background: #4c78a8; color: white; }
  #geocoder-input {
    font: inherit; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px;
    width: 100%; box-sizing: border-box;
  }
  #geocoder-results { margin-top: 4px; max-height: 240px; overflow-y: auto; }
  #geocoder-results.hidden { display: none; }
  .geocoder-item { padding: 6px 8px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
  .geocoder-item:last-child { border-bottom: none; }
  .geocoder-item:hover { background: #f0f0f0; }
  .nav-link {
    font: inherit; background: none; border: 1px solid #ccc; border-radius: 4px;
    padding: 4px 10px; cursor: pointer; color: #333;
    text-decoration: none; display: inline-block;
  }
  .nav-link:hover { background: #f0f0f0; }
  .nav-link.active { background: #4c78a8; color: white; border-color: #4c78a8; }

  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    background: white; padding: 10px 14px; border-radius: 6px;
    font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    max-width: 220px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px; margin: 2px 0;
    cursor: pointer; user-select: none; border-radius: 3px; padding: 1px 2px;
  }
  .legend-item:hover { background: #f0f0f0; }
  .legend-item.inactive { opacity: 0.35; }
  .legend-item span.swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  .lts-face { vertical-align: middle; flex-shrink: 0; }
  #legend-hint { font-size: 11px; color: #777; margin: 4px 0 0; }
  #style-switcher { margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; }
  #style-switcher label { display: block; font-weight: normal; margin: 2px 0; cursor: pointer; }
  /* Compact icon button inside its own maplibregl-ctrl-group, stacked
     below the zoom/compass NavigationControl (see TerrainControl below) -
     sizing/border/hover inherited from maplibregl-ctrl-group's own styles,
     only the active (terrain-on) state needs a custom rule. */
  #terrain-toggle.active { background: #4c78a8; }

  .lts-popup { font: 13px/1.5 system-ui, sans-serif; }
  .lts-popup h3 { font-size: 14px; margin: 0 0 6px; }
  .lts-popup details { margin-top: 6px; }
  .lts-popup summary { cursor: pointer; color: #4c78a8; }
  .priority-note { font-size: 11px; color: #7B2CBF; margin: 4px 0 0; }

  .hidden { display: none !important; }

  /* Back inside #panel, under the basemap switcher - a plain full-width
     button like the original, not the header nav-link style tried in
     between (moved there and back per feedback). */
  #gap-toggle { margin-top: 8px; width: 100%; }
  #gap-toggle.active { background: #4c78a8; color: white; border-color: #4c78a8; }
  #gap-toggle:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Accordion section inside #panel, right under the toggle button -
     collapsed (max-height 0) by default so it takes no space until opened,
     expanding/collapsing with a max-height transition instead of an
     abrupt show/hide. No independent background/shadow/font of its own
     (unlike the old floating-panel version): it's just more content
     inside #panel, which already provides all of that. max-height is a
     safety net for unusually tall rows, not the main way the list's
     length is bounded - GAP_LIST_PAGE_SIZE (paginated in JS) is, so the
     panel doesn't grow into a long internally-scrolling list. */
  #gap-panel {
    margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px;
    max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease;
  }
  #gap-panel.open { max-height: 480px; overflow-y: auto; }
  #gap-panel h2 { font-size: 14px; margin: 0 0 6px; }
  #gap-hint { font-size: 11px; color: #777; margin: 0 0 8px; }
  .gap-item {
    margin: 4px 0; cursor: pointer; border-radius: 3px; padding: 3px 2px;
  }
  .gap-item:hover { background: #f0f0f0; }
  .gap-item-main { display: flex; align-items: center; gap: 6px; }
  .gap-item span.swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  .gap-item-explain { font-size: 11px; color: #777; margin: 2px 0 0 18px; }
  #gap-pager {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 8px;
  }
  #gap-pager button {
    font: inherit; padding: 2px 8px; cursor: pointer;
    border: 1px solid #ccc; border-radius: 4px; background: white;
  }
  #gap-pager button:disabled { opacity: 0.4; cursor: not-allowed; }
  #gap-pager-label { font-size: 11px; color: #777; }

  .info-panel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 20;
    background: white; padding: 16px 20px; border-radius: 6px;
    font: 13px/1.5 system-ui, sans-serif; box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    max-width: 480px; max-height: calc(100vh - 60px); overflow-y: auto;
  }
  .info-panel h2 { font-size: 15px; margin: 0 0 8px; }
  .info-panel h3 { font-size: 13px; margin: 14px 0 4px; color: #222; }
  .info-panel p { margin: 6px 0; }
  .info-panel a { color: #4c78a8; }
  .info-panel-close {
    position: absolute; top: 6px; right: 8px; border: none; background: none;
    font-size: 16px; cursor: pointer; color: #777; line-height: 1;
  }
  #about-subtitle { font-style: italic; color: #555; margin: 0 0 10px; }
  .ai-note { font-style: italic; font-size: 11px; color: #999; margin: 0 0 6px; text-align: left; }

  /* FAQ accordion: independent items (opening one doesn't close another) -
     the ::after +/− indicator is driven by .faq-item.open, toggled per
     item on click (see renderFaq in the script below). */
  .faq-item { border-top: 1px solid #eee; }
  .faq-item:first-child { border-top: none; }
  .faq-question {
    display: block; width: 100%; text-align: left; font: inherit; font-weight: 600;
    background: none; border: none; padding: 10px 22px 10px 0; cursor: pointer; color: #222;
    position: relative;
  }
  .faq-question:hover { color: #4c78a8; }
  .faq-question::after { content: "+"; position: absolute; right: 2px; top: 8px; color: #999; }
  .faq-item.open .faq-question::after { content: "\2212"; }
  .faq-answer { padding: 0 0 10px; }
  .faq-answer.hidden { display: none; }
  .faq-close-answer {
    display: block; margin-top: 8px; font: inherit; font-size: 11px;
    color: #999; background: none; border: none; padding: 0;
    cursor: pointer; text-decoration: underline;
  }
  .faq-close-answer:hover { color: #4c78a8; }

  /* Print widget (see PrintControl in the script below): keeps the map and
     the legend (colour meaning is essential context for a printed map),
     drops everything that's only useful interactively - header/footer
     chrome, every map button control incl. the geocoder (.maplibregl-ctrl-
     group covers it too - would otherwise print a stray icon/flyout in
     the corner), and any open modal (About/FAQ/Privacy - printing mid-read
     of one of those should print that dialog, not silently switch to
     printing the map instead; simplest to just always hide them and let
     the user close the modal and print again if that's what they actually
     wanted). The scale bar is deliberately NOT hidden - also essential
     context on a printed map. */
  @media print {
    #site-header, #site-footer, .maplibregl-ctrl-group, .info-panel {
      display: none !important;
    }
    body, #map-container, #map { height: 100vh !important; width: 100% !important; margin: 0; }
  }
</style>
</head>
<body>
<header id="site-header">
  <div id="header-brand">
    <h1 id="site-title">Stress in bici</h1>
    <span id="site-tagline"></span>
    <span id="area-badge"></span>
  </div>
  <nav id="header-nav">
    <!-- comuni.html (cross-comune stats/comparison page) is deliberately
         unlinked from the main nav for now - work paused, page still
         built and reachable directly, just not discoverable from here
         until it's picked back up. -->
    <button id="about-toggle" class="nav-link"></button>
    <button id="faq-toggle" class="nav-link"></button>
    <button id="privacy-toggle" class="nav-link"></button>
    <div id="lang-switcher">
      <select id="lang-select">
        <option value="it">IT</option>
        <option value="en">EN</option>
        <option value="de">DE</option>
        <option value="fr">FR</option>
      </select>
    </div>
  </nav>
</header>

<div id="map-container">
  <div id="map"></div>
  <div id="panel">
    <div id="legend"></div>
    <p id="legend-hint"></p>
    <div id="style-switcher">
      <label><input type="radio" name="basemap" value="light"> <span id="bg-light-label"></span></label>
      <label><input type="radio" name="basemap" value="summer"> <span id="bg-summer-label"></span></label>
      <label><input type="radio" name="basemap" value="cycling"> <span id="bg-cycling-label"></span></label>
      <label><input type="radio" name="basemap" value="dark"> <span id="bg-dark-label"></span></label>
    </div>
    <button id="gap-toggle"></button>
    <div id="gap-panel">
      <h2 id="gap-heading"></h2>
      <p id="gap-hint"></p>
      <div id="gap-list"></div>
      <div id="gap-pager"></div>
    </div>
  </div>
</div>

<footer id="site-footer">
  <span id="footer-credit"></span>
  <span id="footer-hosting">
    <span id="footer-hosting-text"></span>
    <a href="https://www.top-ix.org/" target="_blank" rel="noopener">
      <img src="https://www.top-ix.org/public/uploads/2024/03/TOP-IX_MainLogo.png" alt="TOP-IX" id="footer-logo" />
    </a>
  </span>
</footer>

<div id="about-panel" class="info-panel hidden">
  <button id="about-close" class="info-panel-close">&times;</button>
  <p id="about-ai-note" class="ai-note hidden"></p>
  <h2 id="about-heading"></h2>
  <p id="about-subtitle"></p>
  <div id="about-body"></div>
</div>
<div id="faq-panel" class="info-panel hidden">
  <button id="faq-close" class="info-panel-close">&times;</button>
  <p id="faq-ai-note" class="ai-note hidden"></p>
  <h2 id="faq-heading"></h2>
  <div id="faq-list"></div>
</div>
<div id="privacy-panel" class="info-panel hidden">
  <button id="privacy-close" class="info-panel-close">&times;</button>
  <h2 id="privacy-heading"></h2>
  <p id="privacy-intro"></p>
</div>
<script src="app.js"></script>
</body>
</html>
