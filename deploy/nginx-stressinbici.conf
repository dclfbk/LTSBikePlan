# nginx site config for stressinbici.it - serves web/ as static files.
# Reflects the actual production config (TLS via Certbot, fronted by
# Cloudflare) - not the setup_server.sh DEPLOY_ROOT default, see `root`
# below.
#
# PMTiles needs HTTP Range request support (nginx serves this by default
# for static files via sendfile, no special directive required) and must
# NOT be gzip-compressed: a gzipped response can't be addressed by byte
# range, which is exactly how the pmtiles.js client reads the tileset -
# gzip is explicitly turned off for it below rather than relying on
# nginx's default gzip-vs-Range interaction. Cloudflare's own cache rule
# for `.pmtiles` (Rules -> Cache Rules, "Respect origin" edge TTL) relies
# on the Cache-Control header set here - without it there's nothing for
# that rule to respect.
#
# Install (first time):
#   sudo cp deploy/nginx-stressinbici.conf /etc/nginx/sites-available/stressinbici.it
#   sudo ln -s /etc/nginx/sites-available/stressinbici.it /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d stressinbici.it -d www.stressinbici.it
# certbot --nginx rewrites the file in place to add the `listen 443 ssl`
# server block + the plain-HTTP redirect block below (marked "managed by
# Certbot") and keeps renewing the certificate on its own - don't hand-edit
# those blocks, only the `location` blocks inside the HTTPS server block.
#
# Cloudflare: DNS proxied (orange cloud) through it, SSL/TLS mode set to
# "Full (strict)" - safe because the origin already carries a real
# Let's Encrypt certificate here (not self-signed), so Cloudflare can
# validate it. See README's now-removed Cloudflare section history / ask
# for the DNS-side (register.it nameservers) and Cache Rule setup if
# reproducing this from scratch.
server {
    server_name stressinbici.it www.stressinbici.it;

    root /var/www/stressinbici.it;
    index index.html;

    # Rebuilds overwrite web/data/*.pmtiles in place (see
    # scripts/build_italy_map_comuni_cron.sh) - a short cache still lets
    # repeat tile-range requests within one visit hit nginx's cache, while
    # ensuring a rebuild is visible to new visitors within the hour
    # instead of only after every client's cache separately expires.
    location ~* \.pmtiles$ {
        gzip off;
        add_header Cache-Control "public, max-age=3600";
    }

    # .bin is the routing graph's compact binary export
    # (scripts/build_routing_graph.py) - structure-of-arrays numeric data
    # still compresses well (repeated small ints, similar-magnitude
    # floats), unlike .pmtiles above: this isn't Range-addressed (fetched
    # whole per comune, not byte-sliced), so gzip is safe here.
    location ~* \.(?:json|geojson|bin)$ {
        gzip on;
        add_header Cache-Control "public, max-age=3600";
    }

    # HTML/JS/CSS change on code deploys (git pull), not on data rebuilds -
    # a short cache keeps a `git pull` from needing a manual cache purge.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stressinbici.it/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stressinbici.it/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.stressinbici.it) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = stressinbici.it) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name stressinbici.it www.stressinbici.it;
    return 404; # managed by Certbot
}
