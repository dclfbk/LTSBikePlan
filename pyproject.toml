[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltsbikeplan"
version = "2.2.0"
description = "Level of Traffic Stress bike planning toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "LTSBikePlan contributors" }
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "requests>=2.28"
]

[project.optional-dependencies]
geo = [
  "geopandas>=0.13",
  "osmnx>=1.6",
  "folium>=0.14",
  "matplotlib>=3.7",
  "networkx>=3.0",
  "rasterio>=1.3",
  "scikit-learn>=1.2",
  "shapely>=2.0",
  "richdem>=0.3",
  "pyrosm>=0.6",
  "pillow>=10.0",
  "pyarrow>=14.0"
]
r = [
  "rpy2>=3.5"
]
dev = [
  "pytest>=7.0"
]

[project.scripts]
ltsbikeplan = "ltsbikeplan.cli:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
include = ["ltsbikeplan*"]

[tool.setuptools.package-data]
ltsbikeplan = ["assets/*.json", "assets/*.css"]
